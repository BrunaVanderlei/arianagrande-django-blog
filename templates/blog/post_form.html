{% extends 'base.html' %}

{% block title %}{% if object %}Editar Post{% else %}Novo Post{% endif %}{% endblock %}

{% block content %}
    <h2>{% if object %}Editar: {{ object.title }}{% else %}Criar Novo Post{% endif %}</h2>

    <form method="post" style="background: white; padding: 20px; border-radius: 8px;">
        {% csrf_token %}
        {% if form %}
            {{ form.as_p }}
        {% else %}
            <p>
                <label for="id_title">Título:</label>
                <input type="text" name="title" id="id_title" value="{{ post.title|default:'' }}">
            </p>
            <p>
                <label for="id_content">Conteúdo:</label>
                <textarea name="content" id="id_content" rows="6">{{ post.content|default:'' }}</textarea>
            </p>
            <p>
                <label for="id_image">Caminho ou URL da imagem:</label>
                <input type="text" name="image" id="id_image" value="{{ post.image|default:'' }}">
            </p>
            <p>
                <label for="id_color">Cor de fundo (Hex):</label>
                <input type="text" name="color" id="id_color" value="{{ post.color|default:'#ECDBE0' }}">
            </p>
        {% endif %}
    </form>
{% endblock %}
